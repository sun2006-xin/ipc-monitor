<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">IPC-Monitor 人脸分析与事件算法链路</title>
  <desc id="desc">展示预处理、ONNX 检测、dlib 识别、规则判断与事件输出。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e7f2ff"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334e68}.box{fill:#fff;stroke:#60a5fa;stroke-width:2;rx:16}.line{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="55" y="58" class="t h">人脸分析与事件算法链路</text>
  <text x="55" y="88" class="t b">默认 CPU 路径：OpenCV DNN + ONNX 检测，dlib 完成关键点定位和 128 维特征识别</text>

  <rect x="45" y="140" width="190" height="200" class="box"/>
  <circle cx="76" cy="172" r="19" fill="#2563eb"/><text x="76" y="178" text-anchor="middle" font-size="16" fill="#fff">1</text>
  <text x="140" y="178" text-anchor="middle" class="t s">帧预处理</text>
  <text x="140" y="222" text-anchor="middle" class="t b">按间隔抽取视频帧</text>
  <text x="140" y="255" text-anchor="middle" class="t b">暗光时仅增强 Y 通道</text>
  <text x="140" y="288" text-anchor="middle" class="t b">CLAHE 2.0 / 8×8</text>

  <rect x="280" y="125" width="215" height="230" class="box"/>
  <circle cx="312" cy="157" r="19" fill="#2563eb"/><text x="312" y="163" text-anchor="middle" font-size="16" fill="#fff">2</text>
  <text x="390" y="163" text-anchor="middle" class="t s">ONNX 人脸检测</text>
  <text x="388" y="208" text-anchor="middle" class="t b">letterbox 到 640×640</text>
  <text x="388" y="241" text-anchor="middle" class="t b">像素归一化 + DNN 推理</text>
  <text x="388" y="274" text-anchor="middle" class="t b">obj × class 置信度过滤</text>
  <text x="388" y="307" text-anchor="middle" class="t b">NMS IoU 0.45</text>
  <text x="388" y="334" text-anchor="middle" class="t b">输出 bbox + confidence</text>

  <rect x="540" y="125" width="230" height="230" class="box"/>
  <circle cx="572" cy="157" r="19" fill="#2563eb"/><text x="572" y="163" text-anchor="middle" font-size="16" fill="#fff">3</text>
  <text x="665" y="163" text-anchor="middle" class="t s">dlib 身份识别</text>
  <text x="655" y="208" text-anchor="middle" class="t b">直接复用检测框</text>
  <text x="655" y="241" text-anchor="middle" class="t b">68 点关键点定位</text>
  <text x="655" y="274" text-anchor="middle" class="t b">提取 128D 描述向量</text>
  <text x="655" y="307" text-anchor="middle" class="t b">与本地人脸库计算欧氏距离</text>
  <text x="655" y="334" text-anchor="middle" class="t b">距离 &lt; 0.6 判为已注册人员</text>

  <rect x="815" y="115" width="335" height="250" class="box"/>
  <circle cx="847" cy="147" r="19" fill="#2563eb"/><text x="847" y="153" text-anchor="middle" font-size="16" fill="#fff">4</text>
  <text x="985" y="153" text-anchor="middle" class="t s">规则引擎</text>
  <text x="985" y="198" text-anchor="middle" class="t b">陌生人：独立 8 秒冷却</text>
  <text x="985" y="231" text-anchor="middle" class="t b">聚集：达到人数阈值且连续 3 个周期</text>
  <text x="985" y="264" text-anchor="middle" class="t b">聚集事件：独立 30 秒冷却</text>
  <text x="985" y="297" text-anchor="middle" class="t b">离岗：人脸和运动均消失 600 秒</text>
  <text x="985" y="330" text-anchor="middle" class="t b">恢复活动后允许下一次离岗事件</text>

  <path d="M235 240 H275" class="line"/><path d="M495 240 H535" class="line"/><path d="M770 240 H810" class="line"/>

  <rect x="155" y="420" width="360" height="145" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="335" y="458" text-anchor="middle" class="t s">多帧注册分支</text>
  <text x="335" y="495" text-anchor="middle" class="t b">最多采集 10 帧，每帧提取 128D 特征</text>
  <text x="335" y="528" text-anchor="middle" class="t b">至少 5 帧成功 → 求均值 → L2 归一化 → 写入人脸库</text>
  <path d="M655 355 V390 H515" class="line"/>

  <rect x="650" y="420" width="400" height="145" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="850" y="458" text-anchor="middle" class="t s">统一事件出口</text>
  <text x="850" y="495" text-anchor="middle" class="t b">事件类型 + 通道名 + 时间 + 快照路径</text>
  <text x="850" y="528" text-anchor="middle" class="t b">状态栏 / 告警音 / 事件历史 / CSV / 本地快照</text>
  <path d="M985 365 V415" class="line"/>
  <text x="600" y="617" text-anchor="middle" class="t b">所有摄像头地址、凭据、人脸特征、事件图片与录像均保存在用户本机，不进入公开仓库。</text>
</svg>
